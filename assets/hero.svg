<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Dagg12 animated developer banner</title><desc id="desc">Animated neon terminal inspired developer banner for Dagg12</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".5" stop-color="#101b3d"/><stop offset="1" stop-color="#06151a"/></linearGradient>
  <linearGradient id="neon" x1="0" x2="1"><stop stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#8b5cf6;#00ff9d;#00e5ff" dur="6s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#00ff9d;#00e5ff;#8b5cf6" dur="6s" repeatCount="indefinite"/></stop></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#4f7cff" stroke-opacity=".10"/></pattern>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<rect width="1200" height="360" rx="28" fill="url(#grid)"/>
<circle cx="1030" cy="70" r="90" fill="#00e5ff" opacity=".08"><animate attributeName="r" values="70;110;70" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="110" cy="300" r="110" fill="#8b5cf6" opacity=".07"><animate attributeName="r" values="90;125;90" dur="7s" repeatCount="indefinite"/></circle>
<rect x="45" y="45" width="1110" height="270" rx="22" fill="#030611" fill-opacity=".72" stroke="url(#neon)" stroke-width="2"/>
<circle cx="75" cy="72" r="7" fill="#ff5f56"/><circle cx="98" cy="72" r="7" fill="#ffbd2e"/><circle cx="121" cy="72" r="7" fill="#27c93f"/>
<text x="150" y="79" fill="#8da2c0" font-family="monospace" font-size="15">dagg12@github:~</text>
<text x="82" y="140" fill="#00e5ff" font-family="monospace" font-size="22">$ whoami</text>
<text x="82" y="177" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="34">Vhukhudo Kevin Thamaga</text>
<text x="82" y="210" fill="#9fb4d0" font-family="sans-serif" font-size="18">Full-STACK • SOFTWARE • NETWORKS • SECURITY • AI • ENTREPRENEURSHIP</text>
<text x="82" y="252" fill="#00ff9d" font-family="monospace" font-size="18">$ status --system</text>
<text x="285" y="252" fill="#ffffff" font-family="monospace" font-size="18">ONLINE</text>
<circle cx="420" cy="246" r="6" fill="#00ff9d" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
<text x="82" y="284" fill="#667a98" font-family="monospace" font-size="14">BUILD → TEST → SECURE → SHIP → REPEAT</text>
<path d="M875 145l34 34-34 34" fill="none" stroke="url(#neon)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><animateTransform attributeName="transform" type="translate" values="0 0;10 0;0 0" dur="2s" repeatCount="indefinite"/></path>
<path d="M930 145l34 34-34 34" fill="none" stroke="#00ff9d" stroke-opacity=".7" stroke-width="3"/>
</svg>
