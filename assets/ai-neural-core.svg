<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Dagg12 AI Neural Core</title><desc id="desc">Animated AI neural core with clearly separated intelligence functions.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset="1" stop-color="#11102b"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#00e5ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff4ecd"/></linearGradient><radialGradient id="core"><stop stop-color="#fff"/><stop offset=".2" stop-color="#00e5ff"/><stop offset=".7" stop-color="#8b5cf6" stop-opacity=".65"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#273052" stroke-opacity=".28"/></pattern></defs>
<rect width="1000" height="390" rx="24" fill="url(#bg)"/><rect width="1000" height="390" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="998" height="388" rx="24" fill="none" stroke="#29345d"/>
<text x="42" y="43" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">DAGG12 // ARTIFICIAL INTELLIGENCE LAB</text><text x="42" y="67" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="12">Explore • build • automate • learn</text>
<!-- links --> <g fill="none" stroke="url(#g)" stroke-width="2" opacity=".7"><path d="M500 205L210 120M500 205L160 205M500 205L210 290M500 205L790 120M500 205L840 205M500 205L790 290"/></g>
<!-- packets --> <g fill="#00e5ff" filter="url(#glow)"><circle r="4"><animateMotion dur="2.2s" repeatCount="indefinite" path="M210 120L500 205"/></circle><circle r="4"><animateMotion dur="2.7s" begin=".5s" repeatCount="indefinite" path="M840 205L500 205"/></circle><circle r="4"><animateMotion dur="2.4s" begin="1s" repeatCount="indefinite" path="M210 290L500 205"/></circle></g>
<!-- core --> <circle cx="500" cy="205" r="92" fill="url(#core)" opacity=".4"><animate attributeName="r" values="82;100;82" dur="3s" repeatCount="indefinite"/></circle><circle cx="500" cy="205" r="54" fill="#090d20" stroke="url(#g)" stroke-width="3" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="0 500 205" to="360 500 205" dur="12s" repeatCount="indefinite"/></circle><circle cx="500" cy="205" r="31" fill="url(#core)"><animate attributeName="opacity" values=".55;1;.55" dur="1.8s" repeatCount="indefinite"/></circle><text x="500" y="211" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">AI CORE</text>
<!-- nodes and labels in dedicated space --> <g fill="#0b1024" stroke="url(#g)" stroke-width="2"><circle cx="210" cy="120" r="13"/><circle cx="160" cy="205" r="13"/><circle cx="210" cy="290" r="13"/><circle cx="790" cy="120" r="13"/><circle cx="840" cy="205" r="13"/><circle cx="790" cy="290" r="13"/></g>
<g fill="#e2e8f0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700"><text x="210" y="101" text-anchor="middle">LEARN</text><text x="160" y="233" text-anchor="middle">SECURE</text><text x="210" y="318" text-anchor="middle">CREATE</text><text x="790" y="101" text-anchor="middle">AUTOMATE</text><text x="840" y="233" text-anchor="middle">ANALYZE</text><text x="790" y="318" text-anchor="middle">CONNECT</text></g>
<rect x="34" y="348" width="932" height="26" rx="8" fill="#070b18" stroke="#202a49"/><text x="50" y="366" fill="#00ff9d" font-family="monospace" font-size="10">● SYSTEM READY</text><text x="190" y="366" fill="#64748b" font-family="monospace" font-size="10">MODEL: EXPLORING</text><text x="350" y="366" fill="#64748b" font-family="monospace" font-size="10">AUTOMATION: BUILDING</text><text x="550" y="366" fill="#64748b" font-family="monospace" font-size="10">SECURITY: AWARE</text><text x="720" y="366" fill="#64748b" font-family="monospace" font-size="10">CREATIVITY: ONLINE</text></svg>