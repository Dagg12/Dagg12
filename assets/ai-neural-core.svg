<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">Dagg12 AI Neural Core</title>
<desc id="desc">Animated AI neural core representing learning, automation, intelligence, security and creative technology.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset="1" stop-color="#11102b"/></linearGradient>
 <linearGradient id="g" x1="0" x2="1"><stop stop-color="#00e5ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff4ecd"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <radialGradient id="core"><stop stop-color="#fff"/><stop offset=".2" stop-color="#00e5ff"/><stop offset=".7" stop-color="#8b5cf6" stop-opacity=".65"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#273052" stroke-opacity=".28"/></pattern>
</defs>
<rect width="1000" height="360" rx="24" fill="url(#bg)"/>
<rect width="1000" height="360" rx="24" fill="url(#grid)"/>
<rect x="1" y="1" width="998" height="358" rx="24" fill="none" stroke="#29345d"/>

<!-- neural links -->
<g fill="none" stroke="url(#g)" stroke-width="2" opacity=".7">
 <path d="M500 180L210 75M500 180L150 180M500 180L210 285M500 180L790 75M500 180L850 180M500 180L790 285"/>
 <path d="M210 75L150 180L210 285M790 75L850 180L790 285" opacity=".45"/>
</g>

<!-- moving data packets -->
<g fill="#00e5ff" filter="url(#glow)">
 <circle r="4"><animateMotion dur="2.2s" repeatCount="indefinite" path="M210 75L500 180"/></circle>
 <circle r="4"><animateMotion dur="2.7s" begin=".5s" repeatCount="indefinite" path="M850 180L500 180"/></circle>
 <circle r="4"><animateMotion dur="2.4s" begin="1s" repeatCount="indefinite" path="M210 285L500 180"/></circle>
</g>

<!-- central intelligence -->
<circle cx="500" cy="180" r="90" fill="url(#core)" opacity=".45">
 <animate attributeName="r" values="82;98;82" dur="3s" repeatCount="indefinite"/>
</circle>
<circle cx="500" cy="180" r="52" fill="#090d20" stroke="url(#g)" stroke-width="3" filter="url(#glow)">
 <animateTransform attributeName="transform" type="rotate" from="0 500 180" to="360 500 180" dur="12s" repeatCount="indefinite"/>
</circle>
<circle cx="500" cy="180" r="30" fill="url(#core)">
 <animate attributeName="opacity" values=".55;1;.55" dur="1.8s" repeatCount="indefinite"/>
</circle>
<text x="500" y="187" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">AI CORE</text>

<!-- nodes -->
<g fill="#0b1024" stroke="url(#g)" stroke-width="2">
 <circle cx="210" cy="75" r="13"/><circle cx="150" cy="180" r="13"/><circle cx="210" cy="285" r="13"/>
 <circle cx="790" cy="75" r="13"/><circle cx="850" cy="180" r="13"/><circle cx="790" cy="285" r="13"/>
</g>
<g fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600">
 <text x="210" y="48" text-anchor="middle">LEARN</text><text x="150" y="207" text-anchor="middle">SECURE</text><text x="210" y="314" text-anchor="middle">CREATE</text>
 <text x="790" y="48" text-anchor="middle">AUTOMATE</text><text x="850" y="207" text-anchor="middle">ANALYZE</text><text x="790" y="314" text-anchor="middle">CONNECT</text>
</g>

<text x="42" y="48" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">DAGG12 // ARTIFICIAL INTELLIGENCE LAB</text>
<text x="42" y="75" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="13">A human-driven intelligence loop — explore • build • automate • learn</text>

<!-- terminal readout -->
<rect x="34" y="315" width="932" height="27" rx="8" fill="#070b18" stroke="#202a49"/>
<text x="50" y="334" fill="#00ff9d" font-family="monospace" font-size="11">● SYSTEM READY</text>
<text x="190" y="334" fill="#64748b" font-family="monospace" font-size="11">MODEL: EXPLORING</text>
<text x="350" y="334" fill="#64748b" font-family="monospace" font-size="11">AUTOMATION: BUILDING</text>
<text x="550" y="334" fill="#64748b" font-family="monospace" font-size="11">SECURITY: AWARE</text>
<text x="720" y="334" fill="#64748b" font-family="monospace" font-size="11">CREATIVITY: ONLINE</text>
</svg>