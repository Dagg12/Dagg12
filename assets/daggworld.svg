<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">DAGGWORLD live design lab</title><desc id="desc">Animated DAGGWORLD design laboratory with moving lights, scanning effects and a playful smirking face.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#050509"/><stop offset=".5" stop-color="#12091f"/><stop offset="1" stop-color="#03151b"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#00e5ff"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft"><feGaussianBlur stdDeviation="12"/></filter><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#8b5cf6" stroke-opacity=".08"/></pattern></defs><rect width="1200" height="560" rx="30" fill="url(#bg)" stroke="#493b72" stroke-width="2"/><rect width="1200" height="560" rx="30" fill="url(#grid)"/><g opacity=".14" stroke="#8b5cf6"><path d="M0 500L400 0M180 560L620 0M700 560L1140 0M900 560L1200 180"/><path d="M0 90H1200M0 520H1200"/></g><text x="55" y="48" fill="#c4b5fd" font-family="monospace" font-size="15">DAGGWORLD // DESIGN LAB // LIVE</text><circle cx="1135" cy="43" r="8" fill="#00ff9d" filter="url(#gl)"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></circle><text x="1060" y="70" fill="#00ff9d" font-family="monospace" font-size="11">COLLECTION ONLINE</text>
<!-- moving atmosphere --> <circle cx="930" cy="180" r="95" fill="#8b5cf6" opacity=".08" filter="url(#soft)"><animate attributeName="cx" values="850;1050;850" dur="7s" repeatCount="indefinite"/></circle><circle cx="300" cy="420" r="70" fill="#00e5ff" opacity=".07" filter="url(#soft)"><animate attributeName="cy" values="390;450;390" dur="5s" repeatCount="indefinite"/></circle>
<!-- playful title: exact emoji preserved --> <text x="55" y="112" fill="url(#a)" font-family="sans-serif" font-size="48" font-weight="800" filter="url(#gl)">DAGGWORLD..</text><text x="420" y="113" font-size="48">😏<animateTransform attributeName="transform" type="rotate" values="-8 445 98;8 445 98;-4 445 98;0 445 98" dur="2.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.7s" repeatCount="indefinite" additive="sum"/></text><text x="58" y="138" fill="#c4b5fd" font-family="sans-serif" font-size="16">CODE × CULTURE × STYLE</text>
<rect x="55" y="160" width="520" height="330" rx="24" fill="#020617" stroke="#8b5cf6" stroke-opacity=".7"/><rect x="55" y="160" width="520" height="330" rx="24" fill="none" stroke="url(#a)" stroke-dasharray="35 520"><animate attributeName="stroke-dashoffset" values="0;-555;0" dur="5s" repeatCount="indefinite"/></rect><g font-family="monospace" text-anchor="middle"><text x="315" y="300" fill="#8b5cf6" font-size="42" filter="url(#gl)">DESIGN LAB</text><text x="315" y="335" fill="#00e5ff" font-size="15">CLOTHING COLLECTION</text><text x="315" y="370" fill="#94a3b8" font-size="12">VISUAL SHOWCASE INITIALIZING...</text><circle cx="315" cy="410" r="6" fill="#00ff9d"><animate attributeName="r" values="4;9;4" dur="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle></g><rect x="75" y="450" width="480" height="25" fill="#020617" opacity=".88"/><text x="92" y="468" fill="#00ff9d" font-family="monospace" font-size="12">● COLLECTION READY // IMAGE SLIDESHOW BELOW</text>
<!-- floating design particles --> <g fill="#00e5ff" filter="url(#gl)"><circle cx="620" cy="140" r="3"><animate attributeName="cy" values="140;105;140" dur="2s" repeatCount="indefinite"/></circle><circle cx="1090" cy="255" r="4"><animate attributeName="cx" values="1090;1050;1090" dur="3s" repeatCount="indefinite"/></circle><circle cx="700" cy="505" r="3"><animate attributeName="cx" values="700;760;700" dur="2.5s" repeatCount="indefinite"/></circle></g>
<g font-family="monospace"><text x="630" y="185" fill="#00ff9d" font-size="14">$ daggworld.design --live</text><text x="630" y="225" fill="#fff" font-size="18">COLLECTION</text><text x="630" y="253" fill="#94a3b8" font-size="13">Original clothing concepts</text><text x="630" y="295" fill="#fff" font-size="15">STATUS</text><text x="760" y="295" fill="#00ff9d" font-size="15">IN DEVELOPMENT</text><text x="630" y="330" fill="#fff" font-size="15">MODE</text><text x="760" y="330" fill="#00e5ff" font-size="15">DESIGN LAB</text><text x="630" y="365" fill="#fff" font-size="15">FOCUS</text><text x="760" y="365" fill="#c4b5fd" font-size="15">IDENTITY + STYLE</text><text x="630" y="400" fill="#fff" font-size="15">PIPELINE</text><text x="760" y="400" fill="#c4b5fd" font-size="15">CONCEPT → MOCKUP</text><rect x="630" y="430" width="450" height="8" rx="4" fill="#111827"/><rect x="630" y="430" width="300" height="8" rx="4" fill="url(#a)"><animate attributeName="width" values="160;430;250;450;300" dur="5s" repeatCount="indefinite"/></rect><text x="630" y="470" fill="#64748b" font-size="12">DESIGNING • DEVELOPING • EVOLVING</text><text x="630" y="500" fill="#00e5ff" font-size="13">BUILDING THE COLLECTION</text></g><text x="55" y="530" fill="#94a3b8" font-family="monospace" font-size="12">CLOTHING • BRAND IDENTITY • DIGITAL CREATIVITY • DESIGN IN PROGRESS</text></svg>