<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img"><title>DAGGWORLD animated brand panel</title><defs><linearGradient id="g"><stop stop-color="#f8fafc"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#00e5ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="250" rx="26" fill="#07070b" stroke="#493b72"/><g opacity=".18" stroke="#8b5cf6"><path d="M0 210L250 0M180 250L430 0M800 250L1050 0M950 250L1200 30"/></g><text x="55" y="50" fill="#a78bfa" font-family="monospace" font-size="15">DAGGWORLD // CORE-FOUNDER PROJECT</text><text x="55" y="110" fill="url(#g)" font-family="sans-serif" font-size="52" font-weight="800" filter="url(#glow)">DAGGWORLD</text><text x="58" y="143" fill="#c4b5fd" font-family="sans-serif" font-size="17">CODE × CULTURE × STYLE</text><text x="58" y="190" fill="#94a3b8" font-family="monospace" font-size="14">CLOTHING • BRAND IDENTITY • DIGITAL CREATIVITY • DESIGN IN PROGRESS</text><circle cx="1110" cy="118" r="42" fill="none" stroke="#00e5ff" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0 1110 118" to="360 1110 118" dur="8s" repeatCount="indefinite"/></circle><circle cx="1110" cy="118" r="7" fill="#00ff9d" filter="url(#glow)"><animate attributeName="r" values="5;11;5" dur="1.5s" repeatCount="indefinite"/></circle><text x="920" y="210" fill="#00ff9d" font-family="monospace" font-size="14">● DESIGNING THE FUTURE</text></svg>