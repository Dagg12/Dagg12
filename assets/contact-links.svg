<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
<title id="title">Dagg12 Contact and Links</title>
<desc id="desc">Animated contact panel inviting visitors to click the links below the panel.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset="1" stop-color="#17102b"/></linearGradient>
 <linearGradient id="g" x1="0" x2="1"><stop stop-color="#00e5ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff4ecd"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#273052" stroke-opacity=".25"/></pattern>
</defs>
<rect width="1000" height="250" rx="24" fill="url(#bg)"/>
<rect width="1000" height="250" rx="24" fill="url(#grid)"/>
<rect x="1" y="1" width="998" height="248" rx="24" fill="none" stroke="#29345d"/>
<path d="M45 77H955" stroke="url(#g)" opacity=".7"><animate attributeName="stroke-dashoffset" from="900" to="0" dur="4s" repeatCount="indefinite"/></path>
<circle cx="70" cy="48" r="5" fill="#00ff9d" filter="url(#glow)"><animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite"/></circle>
<text x="90" y="55" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">DAGG12 // OPEN CHANNEL</text>
<text x="500" y="115" text-anchor="middle" fill="#e2e8f0" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600">Want to connect, collaborate or see what I'm building?</text>
<text x="500" y="145" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="14">👇 The buttons directly below this panel are clickable — choose your destination.</text>
<g fill="none" stroke="url(#g)" stroke-width="2" opacity=".8">
 <path d="M180 190H820" stroke-dasharray="8 12"><animate attributeName="stroke-dashoffset" from="0" to="-80" dur="2s" repeatCount="indefinite"/></path>
</g>
<g font-family="monospace" font-size="11" fill="#64748b">
 <text x="180" y="215">EMAIL</text><text x="390" y="215">GITHUB</text><text x="590" y="215">LINKEDIN</text><text x="790" y="215">PORTFOLIO</text>
</g>
<text x="500" y="238" text-anchor="middle" fill="#00e5ff" font-family="monospace" font-size="11">[ CLICK A LINK BELOW TO ENTER ]</text>
</svg>