<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img"><title>Dagg12 animated build flow</title><defs><linearGradient id="g"><stop stop-color="#00e5ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#00ff9d"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="430" rx="28" fill="#050816" stroke="#233b68"/><g fill="none" stroke="#14264a" stroke-width="2"><path d="M80 70H1120M80 150H1120M80 230H1120M80 310H1120M80 390H1120"/></g><text x="70" y="45" fill="#7dd3fc" font-family="monospace" font-size="15">DAGG12 // BUILD PIPELINE</text><g font-family="sans-serif" text-anchor="middle"><g fill="#07111f" stroke="url(#g)" stroke-width="2"><rect x="455" y="65" width="290" height="48" rx="18"/><rect x="455" y="145" width="290" height="48" rx="18"/><rect x="455" y="225" width="290" height="48" rx="18"/><rect x="455" y="305" width="290" height="48" rx="18"/></g><text x="600" y="95" fill="#fff" font-size="18">💡 IDEA  →  🔎 UNDERSTAND</text><text x="600" y="175" fill="#fff" font-size="18">🧠 DESIGN  →  💻 BUILD</text><text x="600" y="255" fill="#fff" font-size="18">🔐 SECURE  →  🤖 ENHANCE</text><text x="600" y="335" fill="#fff" font-size="18">🧪 TEST / SHIP  →  🚀 IMPROVE</text></g><g stroke="url(#g)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"><path d="M600 113V145"><animate attributeName="stroke-dasharray" values="2 30;30 2" dur=".8s" repeatCount="indefinite"/></path><path d="M600 193V225"><animate attributeName="stroke-dasharray" values="2 30;30 2" dur=".8s" repeatCount="indefinite"/></path><path d="M600 273V305"><animate attributeName="stroke-dasharray" values="2 30;30 2" dur=".8s" repeatCount="indefinite"/></path></g><circle cx="110" cy="105" r="8" fill="#00ff9d" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle><text x="90" y="135" fill="#58749b" font-family="monospace" font-size="13">BUILD</text><text x="90" y="155" fill="#58749b" font-family="monospace" font-size="13">TEST</text><text x="90" y="175" fill="#58749b" font-family="monospace" font-size="13">SECURE</text><text x="1030" y="105" fill="#58749b" font-family="monospace" font-size="13">SHIP</text><text x="1030" y="125" fill="#58749b" font-family="monospace" font-size="13">LEARN</text><text x="1030" y="145" fill="#58749b" font-family="monospace" font-size="13">REPEAT</text></svg>