name: Build DAGGWORLD Design Slideshow

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/daggworld/*.png'
      - 'assets/daggworld/*.jpg'
      - 'assets/daggworld/*.jpeg'
      - 'assets/daggworld/*.webp'

permissions:
  contents: write

jobs:
  build-slideshow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Build and verify animated slideshow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw

          root = Path("assets/daggworld")
          output = root / "daggworld-slideshow.gif"
          supported = {".png", ".jpg", ".jpeg", ".webp"}
          files = sorted(
              p for p in root.iterdir()
              if p.is_file() and p.suffix.lower() in supported
              and p.name.lower() != output.name.lower()
          )

          if not files:
              raise SystemExit("No DAGGWORLD design images found.")

          frames = []
          size = (900, 700)

          for path in files:
              with Image.open(path) as source:
                  image = ImageOps.exif_transpose(source).convert("RGB")
                  image.thumbnail(size, Image.Resampling.LANCZOS)
                  canvas = Image.new("RGB", size, "#020617")
                  x = (size[0] - image.width) // 2
                  y = (size[1] - image.height) // 2
                  canvas.paste(image, (x, y))
                  frames.append(canvas)
                  print(f"Prepared: {path.name} ({source.width}x{source.height})")

          frames[0].save(
              output,
              save_all=True,
              append_images=frames[1:],
              duration=1800,
              loop=0,
              optimize=True,
              disposal=2,
          )

          with Image.open(output) as check:
              frame_count = getattr(check, "n_frames", 1)
              if frame_count != len(frames):
                  raise SystemExit(
                      f"GIF verification failed: expected {len(frames)} frames, got {frame_count}."
                  )
              if check.format != "GIF":
                  raise SystemExit(f"GIF verification failed: format={check.format}.")

          print(f"Verified slideshow: {output} | {len(frames)} frames | {output.stat().st_size} bytes")
          PY

          test -s assets/daggworld/daggworld-slideshow.gif
          file assets/daggworld/daggworld-slideshow.gif

      - name: Commit slideshow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/daggworld/daggworld-slideshow.gif
          if git diff --cached --quiet; then
            echo "Slideshow is already up to date."
          else
            git commit -m "build: update DAGGWORLD design slideshow"
            git push
          fi
