name: 🐍 Generate Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: 🐍 Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Dagg12
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?color_snake=#00e5ff&color_dots=#16213e,#274c77,#3a7ca5,#67b7d1,#00e5ff
            dist/github-snake-dark.svg?color_snake=#00ff9d&color_dots=#07111a,#0b3d3a,#087f5b,#20c997,#00ff9d

      - name: 🚀 Publish generated animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          jekyll: false
          build_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
