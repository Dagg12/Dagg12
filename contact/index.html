<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dagg12 // Open Channel</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#030712;color:#e5e7eb;font-family:Inter,system-ui,Segoe UI,sans-serif;display:grid;place-items:center;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}.panel{position:relative;width:min(920px,92vw);padding:42px;border:1px solid #29345d;border-radius:28px;background:rgba(5,8,22,.82);backdrop-filter:blur(14px);box-shadow:0 0 80px rgba(139,92,246,.18)}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:clamp(28px,5vw,52px);font-weight:800;background:linear-gradient(90deg,#00e5ff,#8b5cf6,#ff4ecd);-webkit-background-clip:text;color:transparent}.status{color:#00ff9d;font:12px monospace}.sub{text-align:center;margin:28px auto 10px;font-size:20px}.hint{text-align:center;color:#94a3b8;margin-bottom:30px}.links{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}.links a{color:white;text-decoration:none;padding:14px 20px;border:1px solid #33406b;border-radius:14px;background:#0b1024;transition:.25s;box-shadow:inset 0 0 20px rgba(0,229,255,.03)}.links a:hover{transform:translateY(-5px);border-color:#00e5ff;box-shadow:0 0 28px rgba(0,229,255,.18)}button{display:block;margin:30px auto 0;border:1px solid #00e5ff;background:#07101d;color:#00e5ff;border-radius:999px;padding:10px 18px;cursor:pointer}.small{text-align:center;color:#64748b;font:11px monospace;margin-top:22px}@media(max-width:600px){.panel{padding:25px}.links a{width:100%;text-align:center}}
</style></head>
<body><canvas id="c"></canvas><main class="panel"><div class="top"><div class="title">DAGG12 // OPEN CHANNEL</div><div class="status">● ONLINE</div></div><div class="sub">Connect. Collaborate. Build something.</div><div class="hint">Choose a channel below. Hover over the nodes and watch the network respond.</div><nav class="links"><a href="mailto:thamagakevin12@gmail.com">📧 EMAIL</a><a href="https://github.com/Dagg12">🐙 GITHUB</a><a href="https://www.linkedin.com/in/thamaga-kevin">💼 LINKEDIN</a><a href="https://dagg12.github.io/Portfolio-Website/">🌐 PORTFOLIO</a><a href="https://dagg12.github.io/Thamas-portfolio/">🏢 THAMAS TECH WORLD</a></nav><button id="sound">🔇 SOUND OFF</button><div class="small">DAGG12 NETWORK // CONTACT PROTOCOL ACTIVE</div></main>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let w,h,n=[];function resize(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);w=innerWidth;h=innerHeight}addEventListener('resize',resize);resize();for(let i=0;i<70;i++)n.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35});function draw(){x.clearRect(0,0,w,h);for(const a of n){a.x=(a.x+a.vx+w)%w;a.y=(a.y+a.vy+h)%h;for(const b of n){let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);if(d<115){x.strokeStyle=`rgba(0,229,255,${(1-d/115)*.12})`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}x.fillStyle='#00e5ff';x.globalAlpha=.5;x.beginPath();x.arc(a.x,a.y,1.5,0,7);x.fill()}x.globalAlpha=1;requestAnimationFrame(draw)}draw();
let audio,playing=false;document.getElementById('sound').onclick=()=>{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(playing){audio.suspend();playing=false;event.target.textContent='🔇 SOUND OFF'}else{audio.resume();playing=true;event.target.textContent='🔊 SOUND ON';tone()}};function tone(){if(!playing)return;let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=110;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.025,audio.currentTime+.08);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+1.2);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+1.25);setTimeout(tone,2400)}
</script></body></html>
