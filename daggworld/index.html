<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAGGWORLD // Design Lab</title><style>body{margin:0;background:#02040a;color:white;font-family:system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(1200px,96vw);text-align:center}img{width:100%;display:block;border-radius:30px;box-shadow:0 0 70px #8b5cf633}button{margin-top:18px;background:#080d18;border:1px solid #00e5ff;color:#00e5ff;border-radius:999px;padding:11px 20px;cursor:pointer;font-weight:700}.bar{display:flex;justify-content:center;gap:12px;align-items:center;color:#94a3b8;font:12px monospace}.volume{accent-color:#00e5ff}</style></head><body><main><img src="../assets/daggworld.svg" alt="Animated DAGGWORLD design lab"><div class="bar"><button id="sound">😏 ENTER DAGGWORLD SOUND</button><input class="volume" id="volume" type="range" min="0" max="1" step=".01" value=".55"><span id="state">AUDIO READY</span></div><audio id="music" preload="auto" loop><source src="../assets/audio/dagg12-theme.mp3" type="audio/mpeg"></audio></main><script>const m=document.getElementById('music'),b=document.getElementById('sound'),v=document.getElementById('volume'),s=document.getElementById('state');m.volume=.55;b.onclick=async()=>{if(m.paused){try{await m.play();b.textContent='🔊 DAGGWORLD SOUND ON';s.textContent='PLAYING // DAGG12 THEME'}catch(e){s.textContent='CLICK AGAIN TO PLAY'}}else{m.pause();b.textContent='😏 ENTER DAGGWORLD SOUND';s.textContent='PAUSED'}};v.oninput=()=>m.volume=v.value;</script></body></html>
