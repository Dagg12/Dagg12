<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAGGWORLD // Design Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#02040a;color:#fff;font-family:Inter,system-ui,Segoe UI,sans-serif;min-height:100vh;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,#8b5cf61f,transparent 30%),radial-gradient(circle at 80% 80%,#00e5ff18,transparent 30%);pointer-events:none}main{width:min(1200px,94vw);margin:40px auto;position:relative}.head{text-align:center}.title{font-size:clamp(38px,7vw,78px);font-weight:900;background:linear-gradient(90deg,#00e5ff,#8b5cf6,#ff4ecd);-webkit-background-clip:text;color:transparent}.tag{color:#94a3b8;font:13px monospace;letter-spacing:3px}.face{font-size:62px;display:inline-block;animation:smirk 2.4s ease-in-out infinite}@keyframes smirk{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(7deg) translateY(-7px)}}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:22px;margin-top:32px}.card{border:1px solid #33406b;border-radius:28px;background:#070b18dd;box-shadow:0 0 60px #8b5cf61a;padding:20px;backdrop-filter:blur(12px)}.card h2{margin:0 0 15px;font-size:16px;font-family:monospace;color:#00e5ff}.showcase{overflow:hidden}.showcase img{width:100%;display:block;aspect-ratio:16/9;object-fit:contain;background:#02040a;border-radius:18px}.music{display:flex;flex-direction:column;justify-content:center;min-height:100%}.disc{width:150px;height:150px;border-radius:50%;margin:10px auto 25px;background:conic-gradient(#00e5ff,#8b5cf6,#ff4ecd,#00e5ff);box-shadow:0 0 45px #8b5cf655;animation:spin 7s linear infinite paused;position:relative}.disc:after{content:"😏";position:absolute;inset:34px;border-radius:50%;display:grid;place-items:center;background:#080b16;font-size:48px}@keyframes spin{to{transform:rotate(360deg)}}.playing .disc{animation-play-state:running}.track{text-align:center;font-weight:800}.state{text-align:center;color:#00ff9d;font:11px monospace;margin:8px}.controls{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}button{background:#080d18;border:1px solid #00e5ff;color:#00e5ff;border-radius:999px;padding:12px 20px;cursor:pointer;font-weight:800}.volume{accent-color:#00e5ff;width:120px}.hint{text-align:center;color:#64748b;font:11px monospace;margin-top:15px}.footer{text-align:center;margin:25px;color:#64748b;font:11px monospace}@media(max-width:800px){.grid{grid-template-columns:1fr}.music{min-height:420px}}
</style></head><body><main><header class="head"><div class="face">😏</div><div class="title">DAGGWORLD</div><div class="tag">CODE • CREATE • WEAR YOUR IDENTITY</div></header><section class="grid"><div class="card showcase"><h2>👕 CLOTHING COLLECTION // LIVE SLIDESHOW</h2><img src="../assets/daggworld/daggworld-slideshow.gif" alt="DAGGWORLD clothing collection slideshow"><div class="hint">DESIGNING • DEVELOPING • EVOLVING</div></div><div class="card music" id="musicCard"><h2>🎵 DAGGWORLD // ORIGINAL SOUND</h2><div class="disc"></div><div class="track">DAGG12 THEME</div><div class="state" id="state">AUDIO READY</div><div class="controls"><button id="sound">▶ PLAY MUSIC</button><input class="volume" id="volume" type="range" min="0" max="1" step=".01" value=".55" aria-label="Music volume"></div><div class="hint">Music continues while the collection plays.</div></div></section><div class="footer">DAGGWORLD // IN DEVELOPMENT • CLOTHING • CULTURE • DIGITAL CREATIVITY</div><audio id="music" preload="auto" loop><source src="../assets/audio/dagg12-theme.mp3" type="audio/mpeg"></audio></main><script>const m=document.getElementById('music'),b=document.getElementById('sound'),v=document.getElementById('volume'),s=document.getElementById('state'),card=document.getElementById('musicCard');m.volume=.55;b.onclick=async()=>{if(m.paused){try{await m.play();b.textContent='⏸ PAUSE MUSIC';s.textContent='PLAYING // DAGG12 THEME';card.classList.add('playing')}catch(e){s.textContent='AUDIO COULD NOT START — CLICK AGAIN'}}else{m.pause();b.textContent='▶ PLAY MUSIC';s.textContent='PAUSED';card.classList.remove('playing')}};v.oninput=()=>m.volume=v.value;</script></body></html>
